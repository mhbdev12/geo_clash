name: geoclash
description: "A polished offline Flutter geography trivia game."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0 # Add this line
  cached_network_image: ^4.0.4 # (or latest version)
  url_launcher: ^6.3.0 # Add this line
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  vibration: ^3.1.3
  path_provider: ^2.1.2
  http: ^1.2.0
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # Add this line


flutter:
  uses-material-design: true


  # To add assets to your application, add an assets section, like this:
  assets:
   - assets/sounds/
   - assets/pics/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pics/flag_icon.jpg" # Uses your existing globe image
  min_sdk_android: 21 # Required for Android adaptive icons